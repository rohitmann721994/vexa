[pytest]
pythonpath = . libraries

# Directory where pytest should look for tests
testpaths = tests

# Naming conventions for test files, classes, and functions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default command line options
addopts = -v --tb=short --strict-markers --ignore=.venv

# Custom markers — categorize tests so you can run specific groups.
# --strict-markers is on, so register a marker here BEFORE using it.
markers =
    ui: tests related to UI/frontend automation
    api: tests related to API/backend automation
    slow: tests that take a long time to execute
    smoke: fast health checks that a page/feature loads and renders
    regression: guards against a specific defect or regression re-appearing
    ticket: marks tests with the tracker ID(s) they verify (e.g. @pytest.mark.ticket("ABC-123"))

# --- Live Console Logging ---
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# --- File Logging ---
log_file = logs/automation.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_file_date_format = %Y-%m-%d %H:%M:%S
